name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
       - run: npm ci
      - run: npm run check:versions
      - run: npm run lint:openapi
       - run: npm test
      - run: npm run check

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Skipping Cloudflare deployment because CLOUDFLARE_API_TOKEN is not configured."
            exit 0
          fi
          npx wrangler deploy --env production
      - name: Refresh production snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$IRIS_REFRESH_TOKEN" ]; then
            echo "::notice::Skipping immediate snapshot refresh because deployment or refresh credentials are not configured."
            exit 0
          fi
          curl --fail --show-error --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $IRIS_REFRESH_TOKEN" \
            -X POST https://iris-api.benhxm.workers.dev/internal/refresh
