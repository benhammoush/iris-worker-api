openapi: 3.1.0
info:
  title: Iris API
  version: 3.2.0
paths:
  /internal/refresh:
    post:
      security: [{ refreshToken: [] }]
      responses:
        '200': { description: Snapshot refresh completed. }
        '401': { description: REFRESH_UNAUTHORIZED }
        '502': { description: REFRESH_FAILED }
  /health:
    get:
      responses:
        '200': { description: Worker is running }
  /ready:
    get:
      responses:
        '200': { description: A usable resolved snapshot is available }
        '503': { description: Snapshot KV binding or resolved data is unavailable }
  /v2/status:
    get:
      responses:
          '200': { description: API version, Solana snapshot freshness, market sources, and registered-pool swap status }
  /v2/market:
    get:
      responses:
          '200': { description: Finalized Solana slot plus the current Jupiter catalog. Price history is available from asset detail. }
  /v2/assets:
    get:
      responses:
          '200': { description: Up to 50 verified top-traded Solana assets, identified by canonical mint address. Missing provider values are null. }
  /v2/assets/mint/{mint}:
    get:
      parameters:
        - in: path
          name: mint
          required: true
          schema: { type: string }
      responses:
          '200': { description: Asset found by its canonical mint address, with up to seven daily GeckoTerminal price points when available. History metadata reports fresh, stale, fixture, or unavailable state. }
        '404': { description: Asset not found }
  /v2/assets/{symbol}:
    get:
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        '200': { description: Asset }
        '404': { description: Asset not found }
  /v2/swaps:
    get:
      responses:
          '200': { description: Recent decoded swaps from the reviewed registered Solana pools only. This is not a chain-wide feed. }
  /v2/wallets:
    get:
      description: Returns no curated addresses. Use the address route for any valid public Solana address.
      responses:
          '200': { description: Empty list; Iris does not track wallet addresses. }
  /v2/wallets/{address}:
    get:
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
      responses:
          '200': { description: Live SOL/SPL/Token-2022 public balances, totalValue, and decoded activity. Atomic amounts remain strings. }
          '400': { description: INVALID_WALLET_ADDRESS }
          '503': { description: WALLET_LOOKUP_UNAVAILABLE }
components:
  securitySchemes:
    refreshToken:
      type: http
      scheme: bearer
