openapi: 3.1.0
info:
  title: Iris API
  version: 2.6.3
paths:
  /internal/refresh:
    post:
      security: [{ refreshToken: [] }]
      responses:
        '200': { description: Snapshot refresh completed. }
        '401': { description: REFRESH_UNAUTHORIZED }
        '502': { description: REFRESH_FAILED }
  /health:
    get:
      responses:
        '200': { description: Worker is running }
  /ready:
    get:
      responses:
        '200': { description: A usable resolved snapshot is available }
        '503': { description: Snapshot KV binding or resolved data is unavailable }
  /v1/status:
    get:
      responses:
          '200': { description: API version, snapshot freshness, market source, and global Hiro swap scan count/status }
  /v1/market:
    get:
      responses:
        '200': { description: Live Hiro fees, latest Stacks tip and supply, plus CoinGecko/DexScreener market data when configured or snapshot fallback }
  /v1/assets:
    get:
      responses:
          '200': { description: Tradable Stacks fungible tokens identified by full contract principal. Market changes are null when no verified provider history exists. }
  /v1/assets/id/{contractId}:
    get:
      parameters:
        - in: path
          name: contractId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Asset found by its canonical contract principal. }
        '404': { description: Asset not found }
  /v1/assets/{symbol}:
    get:
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
      responses:
        '200': { description: Asset }
        '404': { description: Asset not found }
  /v1/swaps:
    get:
      responses:
          '200': { description: Recent chain-wide DEX transaction records from Hiro. input, output, side, and value are nullable until they can be proven. }
  /v1/wallets:
    get:
      description: Returns metadata for the fixed public third-party demo wallet addresses; no wallet credentials are required.
      responses:
        '200': { description: Metadata for the three public third-party demo wallets }
  /v1/wallets/{address}:
    get:
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
      responses:
          '200': { description: Cached public wallet balances, totalValue, and grouped activity. Atomic transfer amounts remain strings. portfolioTotal and transactions are compatibility aliases. }
        '404': { description: CURATED_WALLET_NOT_FOUND }
components:
  securitySchemes:
    refreshToken:
      type: http
      scheme: bearer
