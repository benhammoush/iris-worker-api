name = "iris-api"
main = "src/index.js"
compatibility_date = "2026-10-02"

[observability.logs]
enabled = true
invocation_logs = true

[vars]
CORS_ORIGINS = "http://localhost:3000,http://localhost:5173"

[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "837c0562b3844757b252f0324dc70b74"

# Local-only: npm run dev explicitly disables remote access.
[env.local]
name = "iris-api-local"

[env.local.vars]
CORS_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[[env.local.kv_namespaces]]
binding = "SNAPSHOTS"
id = "00000000000000000000000000000000"

[env.dev]
name = "iris-api-dev"

[env.dev.vars]
CORS_ORIGINS = "https://iris-dev.vercel.app,http://localhost:5173"

[[env.dev.kv_namespaces]]
binding = "SNAPSHOTS"
# Verified existing dev-SNAPSHOTS namespace; distinct from staging/production.
id = "837c0562b3844757b252f0324dc70b74"

[env.e2e]
name = "iris-api-e2e"

[env.e2e.vars]
CORS_ORIGINS = "http://127.0.0.1:4173"
PROVIDER_MODE = "cache-only"

[[env.e2e.kv_namespaces]]
binding = "SNAPSHOTS"
id = "00000000000000000000000000000000"

[env.staging]
name = "iris-api-staging"

[env.staging.vars]
# Replace with the stable staging frontend origin before enabling deployment.
CORS_ORIGINS = "http://localhost:3000,http://localhost:5173"

[[env.staging.kv_namespaces]]
binding = "SNAPSHOTS"
id = "8409635b839c49558d1b6e9bdeaf0f03"

[env.staging.triggers]
crons = ["0 * * * *"]

[env.production]
name = "iris-api"

[env.production.vars]
CORS_ORIGINS = "http://localhost:3000,http://localhost:5173,https://iris-dashboard-phi.vercel.app"

[[env.production.kv_namespaces]]
binding = "SNAPSHOTS"
id = "d9cc2796e2954a498851b3ad5ecefd59"

[env.production.triggers]
crons = ["0 * * * *"]
